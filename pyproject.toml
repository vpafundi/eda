[project]
name = "eda-aic"
version = "0.1.0"
description = "Standalone EDA pipeline for AIC insurance document segments (silver labels, macro/micro taxonomy)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[dependency-groups]
# Probe bge-m3, cleanlab, UMAP, token-length scan (transformers).
ml = [
    "transformers>=4.56",
    "huggingface-hub>=0.34",
    "sentence-transformers>=3.0",
    "cleanlab>=2.5",
    "umap-learn>=0.5",
    "matplotlib>=3.8",
]
notebook = [
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "nbconvert>=7.0",
]
# Parquet su S3 (SageMaker); su Mac locale non serve.
s3 = [
    "s3fs>=2024.6",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
eda-run = "eda.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eda"]

[tool.uv]
default-groups = ["ml", "notebook"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
